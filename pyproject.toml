[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakecommit"
version = "0.1.0"
description = "Deterministic, offline file-level lake table commit protocol verification bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
lakecommit = "lakecommit.cli:main"

[tool.setuptools.packages.find]
include = ["lakecommit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
